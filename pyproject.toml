[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "interrater-agreement"
version = "0.1.0"
description = "Compute Cohen's kappa, weighted kappa, Fleiss' kappa and percent agreement."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "JANIN A APURBA", email = "japurba97@gmail.com"}]
keywords = ["research", "automation", "reproducibility", "academic"]
dependencies = []

[project.scripts]
interrater-agreement = "interrater_agreement.cli:main"

[tool.setuptools]
packages = ["interrater_agreement"]
